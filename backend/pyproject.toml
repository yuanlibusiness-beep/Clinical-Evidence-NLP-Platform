[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-evidence-nlp"
version = "1.0.0"
description = "Turns clinical papers into structured, source-grounded evidence reviews."
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yuan Li" }]

dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2",
  "email-validator>=2.1",
  "python-multipart>=0.0.9",
  "SQLAlchemy>=2.0.29",
  "alembic>=1.13",
  "PyJWT>=2.8",
  "bcrypt>=4.1",
  "httpx>=0.27",
  "numpy>=1.26",
  "PyMuPDF>=1.24",
  "celery>=5.3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.2.5"]
workers = ["redis>=5.0"]
observability = [
  "opentelemetry-sdk>=1.24",
  "opentelemetry-exporter-otlp-proto-http>=1.24",
  "opentelemetry-instrumentation-fastapi>=0.45b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
  "langfuse>=2.30",
]
rerank = ["sentence-transformers>=2.6"]
dev = [
  "pytest>=8.1",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.9",
  "types-requests",
]

[project.scripts]
cenp-eval = "app.evaluation.runner:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.evaluation" = ["datasets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
